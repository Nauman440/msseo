<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0D0817" />
    <title>Offline · Morosoft SEO Audit</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: #0d0817 radial-gradient(60% 80% at 85% 0%, rgba(109, 64, 188, 0.45), transparent 60%);
        color: #fff;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      main { max-width: 360px; text-align: center; }
      img { width: 56px; height: 56px; }
      h1 { margin: 20px 0 8px; font-size: 24px; letter-spacing: -0.02em; }
      p { margin: 0 0 24px; color: rgba(255, 255, 255, 0.6); line-height: 1.6; }
      button {
        min-height: 44px;
        padding: 0 22px;
        border: 0;
        border-radius: 999px;
        background: #00e5bf;
        color: #0d0817;
        font: 600 14px system-ui, sans-serif;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Audits and reports need a connection. Check your network and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
