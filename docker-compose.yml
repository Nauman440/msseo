# Optional: full stack on one machine. Production runs on Coolify (CLAUDE.md §13).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seo
      POSTGRES_PASSWORD: seo
      POSTGRES_DB: seo_audit
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://seo:seo@postgres:5432/seo_audit
      REDIS_URL: redis://redis:6379
    ports:
      - '3000:3000'
    depends_on: [postgres, redis]

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://seo:seo@postgres:5432/seo_audit
      REDIS_URL: redis://redis:6379
      APP_URL: http://web:3000
    depends_on: [postgres, redis, web]

volumes:
  pgdata:
